# Thin caller for the org reusable Changesets release (npm provenance enabled).
# NPM_TOKEN is synced from Phase.dev into the Production GitHub Environment.
name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  release:
    uses: MonetizeKit/.github/.github/workflows/reusable-sdk-release.yml@v1
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
