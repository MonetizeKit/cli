# Thin caller for the org reusable SDK CI.
# The Required Checks Gate job is defined HERE so the branch-protection
# context name stays stable.
name: CI

on:
  push:
    branches: [main, delivery, development]
  pull_request:
    branches: [main, delivery, development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: MonetizeKit/.github/.github/workflows/reusable-sdk-ci.yml@v1
    with:
      run-lint: false # no lint script yet; add eslint before flipping this on
      package-entry-guard: false # oclif CLI ships bin/run.js, not a package entry module
      extra-check-command: pnpm smoke

  required-checks:
    name: Required Checks Gate
    needs: [ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        run: |
          if [ "${{ needs.ci.result }}" != "success" ]; then
            echo "CI failed or was cancelled: ${{ needs.ci.result }}"
            exit 1
          fi
